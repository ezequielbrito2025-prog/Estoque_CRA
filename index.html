<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Contagem de Inventário</title>
<script src="js/vendor/xlsx.full.min.js"></script>
<style>
/* =========================================================
   TOKENS — paleta extraída da logo do Consórcio Recife Ambiental
   (lima #57ed00 · verde-bandeira #1cad03 · verde-escuro #3e9415)
   ========================================================= */
:root{
  color-scheme: light;
  --brand-900:#14300a;
  --brand-800:#1e4a0e;
  --brand-700:#2e6f0f;
  --brand-600:#378512;
  --brand-500:#1cad03;
  --brand-400:#57ed00;
  --brand-300:#94f36a;
  --brand-200:#c6f7ab;
  --brand-100:#e2fad4;
  --brand-50:#f2fce9;

  --surface:#fcfcfb;
  --surface-alt:#f4f7f4;
  --surface-raised:#ffffff;
  --page:#eef3ee;
  --text-primary:#0b1210;
  --text-secondary:#4c564e;
  --text-muted:#82897f;
  --border:#dde4dc;
  --border-strong:#c4cec2;

  --good:#0ca30c;
  --warning:#c97e00;
  --warning-bg:#fff3d9;
  --serious:#c8502d;
  --serious-bg:#fde3d8;
  --critical:#c23434;
  --critical-bg:#fbdede;
  --pending:#82897f;
  --pending-bg:#eceeeb;

  --cat-1:#2a78d6;
  --cat-2:#eb6834;
  --cat-3:#1baf7a;
  --cat-4:#c98500;
  --cat-5:#e87ba4;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(11,18,16,0.06);
  --shadow-md:0 4px 16px rgba(11,18,16,0.08);
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --surface:#12180f;
    --surface-alt:#182015;
    --surface-raised:#1b241a;
    --page:#0d120c;
    --text-primary:#f3f7f1;
    --text-secondary:#c3ccc0;
    --text-muted:#8f988c;
    --border:#2a352a;
    --border-strong:#3a463a;
    --good:#3dbf52;
    --warning:#f0b429;
    --warning-bg:#3a2f10;
    --serious:#ec835a;
    --serious-bg:#3c231a;
    --critical:#e66767;
    --critical-bg:#3c1e1e;
    --pending:#9aa196;
    --pending-bg:#232b21;
    --cat-1:#3987e5;
    --cat-2:#d95926;
    --cat-3:#199e70;
    --cat-4:#e0a300;
    --cat-5:#d55181;
  }
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button, input, select, textarea{font-family:inherit;font-size:1rem;}
button{cursor:pointer;}
a{color:var(--brand-700);}
.hidden{display:none !important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}

/* ---------- Layout shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:linear-gradient(135deg,var(--brand-800),var(--brand-600));
  color:#fff;
  padding:10px 18px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
  position:sticky;top:0;z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:.2px;}
.brand .logo-mark{
  width:34px;height:34px;border-radius:9px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;padding:5px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.brand .logo-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.topbar .spacer{flex:1;}
.user-chip{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);
  padding:6px 12px 6px 8px;border-radius:999px;font-size:.85rem;
}
.user-chip .avatar{
  width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brand-700);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;
}
.user-chip button{background:none;border:none;color:#fff;opacity:.85;font-size:.8rem;text-decoration:underline;padding:0;}

.tabs{
  display:flex;gap:2px;background:var(--surface-raised);
  border-bottom:1px solid var(--border);
  padding:0 12px;overflow-x:auto;position:sticky;top:53px;z-index:19;
}
.tab-btn{
  border:none;background:none;padding:12px 14px;font-size:.88rem;font-weight:600;
  color:var(--text-secondary);border-bottom:3px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab-btn:hover{color:var(--brand-700);}
.tab-btn.active{color:var(--brand-700);border-bottom-color:var(--brand-500);}
.tab-btn .badge-count{
  background:var(--critical);color:#fff;border-radius:999px;font-size:.68rem;
  padding:1px 6px;font-weight:700;
}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:18px 18px 90px;}

/* bottom nav (mobile) */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--surface-raised);border-top:1px solid var(--border);
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
  padding:4px 2px calc(4px + env(safe-area-inset-bottom));
}
.bottom-nav .bn-row{display:flex;}
.bn-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:none;background:none;color:var(--text-muted);padding:6px 2px;border-radius:10px;
  font-size:.62rem;font-weight:600;position:relative;
}
.bn-btn .bn-icon{font-size:1.15rem;}
.bn-btn.active{color:var(--brand-700);background:var(--brand-50);}
.bn-btn .badge-count{position:absolute;top:2px;right:14%;background:var(--critical);color:#fff;border-radius:999px;font-size:.6rem;padding:0 4px;font-weight:700;}

@media (max-width:720px){
  .tabs{display:none;}
  .bottom-nav{display:block;}
  main{padding:12px 10px 84px;}
  .topbar{padding:8px 12px;}
}

/* ---------- generic components ---------- */
.card{
  background:var(--surface-raised);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);
}
.section-title{font-size:1.05rem;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.section-sub{color:var(--text-secondary);font-size:.85rem;margin:0 0 14px;}
.grid{display:grid;gap:14px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.two-col{grid-template-columns:1.3fr 1fr;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

.kpi{
  background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;box-shadow:var(--shadow-sm);
}
.kpi .kpi-label{font-size:.74rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.kpi .kpi-value{font-size:1.65rem;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;}
.kpi .kpi-sub{font-size:.78rem;color:var(--text-secondary);margin-top:2px;}
.kpi.accent .kpi-value{color:var(--brand-700);}
.kpi.warn .kpi-value{color:var(--warning);}
.kpi.bad .kpi-value{color:var(--critical);}
.kpi.good .kpi-value{color:var(--good);}

.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  border-radius:var(--radius-md);border:1px solid var(--border-strong);
  background:var(--surface-raised);color:var(--text-primary);
  padding:9px 15px;font-weight:700;font-size:.88rem;transition:background .1s;
}
.btn:hover{background:var(--surface-alt);}
.btn-primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff;}
.btn-primary:hover{background:var(--brand-700);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{border-color:transparent;background:none;}
.btn-danger{color:var(--critical);border-color:var(--critical-bg);background:var(--critical-bg);}
.btn-sm{padding:5px 10px;font-size:.78rem;border-radius:8px;}
.btn-lg{padding:14px 18px;font-size:1rem;border-radius:14px;}
.btn-block{width:100%;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:.78rem;font-weight:700;color:var(--text-secondary);}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=search],.field select,.field textarea{
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 10px;
  background:var(--surface);color:var(--text-primary);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-400);outline-offset:0;border-color:var(--brand-500);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row > .field{flex:1;min-width:140px;}

.badge{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;
  font-size:.74rem;font-weight:700;white-space:nowrap;
}
.badge-pending{background:var(--pending-bg);color:var(--pending);}
.badge-ok{background:#dff5df;color:var(--good);}
.badge-sobra{background:var(--warning-bg);color:var(--warning);}
.badge-falta{background:var(--critical-bg);color:var(--critical);}
.badge-conflito{background:var(--serious-bg);color:var(--serious);}

table{width:100%;border-collapse:collapse;font-size:.85rem;}
thead th{
  text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-muted);border-bottom:1px solid var(--border);padding:8px 10px;white-space:nowrap;
}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-alt);}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.text-right{text-align:right;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);}
.table-wrap table{min-width:640px;}

.toast-host{position:fixed;top:14px;right:14px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--text-primary);color:var(--surface);padding:10px 16px;border-radius:10px;
  font-size:.85rem;box-shadow:var(--shadow-md);animation:toastin .18s ease-out;max-width:320px;
}
.toast.err{background:var(--critical);}
.toast.ok{background:var(--brand-700);}
@keyframes toastin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-muted);
}
.empty-state .es-icon{font-size:2.4rem;margin-bottom:8px;}

.progress-track{background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;height:10px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--brand-500),var(--brand-400));height:100%;border-radius:999px;transition:width .3s;}

/* bar chart (dataviz: identity colours, direct labels, thin marks, 2px gaps) */
.barchart{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:grid;grid-template-columns:128px 1fr 64px;align-items:center;gap:10px;}
.bar-row .bar-label{font-size:.8rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{background:var(--surface-alt);border-radius:5px;height:18px;position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;min-width:3px;transition:width .4s;}
.bar-row .bar-value{font-size:.8rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--text-secondary);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex:none;}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%,var(--brand-100),transparent 55%),
  radial-gradient(circle at 80% 0%,var(--brand-50),transparent 50%), var(--page);padding:20px;}
.login-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);padding:32px 28px;max-width:400px;width:100%;}
.login-card .login-logo{width:210px;max-width:100%;height:auto;display:block;margin:0 auto 18px;}
.login-title{font-size:1.35rem;font-weight:800;margin:0 0 2px;}
.login-sub{color:var(--text-secondary);font-size:.88rem;margin:0 0 20px;}
.profile-pick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.profile-opt{flex:1;min-width:120px;border:1.5px solid var(--border-strong);border-radius:10px;padding:10px;text-align:center;background:var(--surface);}
.profile-opt.active{border-color:var(--brand-600);background:var(--brand-50);color:var(--brand-800);font-weight:700;}

/* import mapping */
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
@media (max-width:600px){.map-grid{grid-template-columns:1fr;}}
.map-row{display:flex;align-items:center;gap:8px;}
.map-row .arrow{color:var(--text-muted);}
.dropzone{
  border:2px dashed var(--border-strong);border-radius:var(--radius-lg);padding:34px 16px;text-align:center;
  color:var(--text-secondary);background:var(--surface-alt);cursor:pointer;
}
.dropzone.drag{border-color:var(--brand-500);background:var(--brand-50);}
.dropzone .dz-icon{font-size:2rem;margin-bottom:8px;}

/* contagem por corredor (checklist, sem digitar código) */
.blind-note{
  background:var(--brand-50);color:var(--brand-800);border-radius:8px;padding:7px 10px;font-size:.75rem;
  margin-top:10px;display:flex;gap:6px;align-items:center;
}
.count-list{display:flex;flex-direction:column;gap:8px;}
.count-row{
  background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:10px 12px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  transition:background .25s, border-color .25s;
}
.count-row-done{opacity:.72;}
.count-row.row-highlight{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100);}
.count-row.cr-saved{background:var(--brand-50);border-color:var(--brand-400);}
.cr-info{min-width:0;flex:1;}
.cr-code{font-size:.72rem;color:var(--text-muted);font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;flex-wrap:wrap;gap:2px;}
.cr-desc{font-weight:600;font-size:.9rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-conflict{font-size:.74rem;color:var(--serious);font-weight:700;margin-top:4px;}
.cr-qty-wrap{display:flex;align-items:center;gap:6px;flex:none;}
.cr-qty-input{
  width:88px;text-align:center;font-size:1.15rem;font-weight:800;border:1.5px solid var(--border-strong);
  border-radius:10px;padding:9px 6px;font-variant-numeric:tabular-nums;background:var(--surface);
}
.cr-qty-input:focus{outline:2px solid var(--brand-400);outline-offset:0;border-color:var(--brand-500);}
.cr-um{font-size:.74rem;color:var(--text-muted);font-weight:700;min-width:28px;}
.count-row-confirm{background:var(--critical-bg);border-color:var(--critical);}
.cr-confirm-actions{display:flex;align-items:center;gap:8px;flex:none;}
.cr-confirm-text{font-size:.76rem;font-weight:700;color:var(--critical);}
@media (max-width:560px){
  .count-row{flex-wrap:wrap;}
  .cr-qty-wrap{margin-left:auto;}
}

.filters-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  border:1px solid var(--border-strong);border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:600;
  background:var(--surface-raised);color:var(--text-secondary);
}
.chip.active{background:var(--brand-600);border-color:var(--brand-600);color:#fff;}

.audit-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.audit-item:last-child{border-bottom:none;}
.audit-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-500);margin-top:6px;flex:none;}
.audit-when{font-size:.72rem;color:var(--text-muted);white-space:nowrap;}
.audit-what{font-size:.85rem;}
.audit-who{font-weight:700;}

.pill-tab{display:flex;gap:6px;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;width:fit-content;}
.pill-tab button{border:none;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:.82rem;color:var(--text-secondary);}
.pill-tab button.active{background:var(--surface-raised);color:var(--brand-700);box-shadow:var(--shadow-sm);}


/* ---------- sincronização / tempo real ---------- */
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;margin-right:8px;white-space:nowrap;}
.sync-badge i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.sync-on{background:rgba(255,255,255,.18);color:#fff;}
.sync-on i{background:#7dff4d;box-shadow:0 0 0 0 rgba(125,255,77,.7);animation:pulse 1.8s infinite;}
.sync-off{background:#fff3d9;color:#8a5600;}
.sync-off i{background:#c97e00;}
.sync-local{background:rgba(255,255,255,.14);color:#fff;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(125,255,77,.6);}70%{box-shadow:0 0 0 7px rgba(125,255,77,0);}100%{box-shadow:0 0 0 0 rgba(125,255,77,0);}}
@media (max-width:560px){.user-chip span:not(.avatar){display:none;} .sync-badge{font-size:.68rem;padding:3px 8px;margin-right:4px;}}

/* rascunho da contagem + botão de envio */
.count-row.has-draft{border-color:var(--brand-400);background:var(--brand-50);}
.count-row.has-draft .cr-qty-input{border-color:var(--brand-500);color:var(--brand-800);}
.cr-qty-input.invalid{border-color:var(--critical)!important;background:var(--critical-bg);}
.count-row-queued{opacity:.85;border-style:dashed;}
.send-bar{
  position:sticky;bottom:12px;z-index:20;margin-top:14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--surface-raised);border:1.5px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:12px 14px;box-shadow:var(--shadow-md);
}
.send-bar.has-items{border-color:var(--brand-500);box-shadow:0 6px 22px rgba(28,173,3,.22);}
.send-bar-info{font-size:.85rem;color:var(--text-secondary);min-width:0;flex:1;}
.send-bar-info strong{color:var(--brand-800);}
.send-bar-queue{font-size:.75rem;color:var(--warning);font-weight:700;margin-top:2px;}
.send-bar-actions{display:flex;gap:8px;align-items:center;}
.btn-send{font-size:1rem;padding:12px 18px;font-weight:800;}
.btn[hidden]{display:none!important;}
.btn-send:disabled{opacity:.5;cursor:not-allowed;}
.btn.confirm{color:var(--critical);border-color:var(--critical);}
@media (max-width:720px){
  .send-bar{bottom:76px;}
  .send-bar-actions{width:100%;}
  .send-bar-actions .btn-send{flex:1;}
}

/* painel ao vivo do gestor */
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--good);margin-right:4px;animation:pulse 1.8s infinite;vertical-align:middle;}
.live-dot.off{background:var(--warning);animation:none;}
.team-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;}
.team-row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:var(--radius-md);}
.avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--pending-bg);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;flex:none;}
.avatar-sm.on{background:var(--brand-100);color:var(--brand-800);box-shadow:0 0 0 2px var(--brand-400);}
.team-info{flex:1;min-width:0;}
.team-name{font-weight:700;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-sub{font-size:.74rem;color:var(--text-muted);}
.team-stats{text-align:right;display:flex;flex-direction:column;line-height:1.15;}
.team-stats strong{font-size:1.1rem;font-variant-numeric:tabular-nums;}
.team-stats span{font-size:.68rem;color:var(--text-muted);}
.team-stats em{font-size:.68rem;color:var(--good);font-style:normal;font-weight:700;}
.feed{display:flex;flex-direction:column;max-height:340px;overflow:auto;}
.feed-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.feed-row:last-child{border-bottom:none;}
.feed-when{font-size:.72rem;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:1px;}
.feed-row{animation:toastin .3s ease-out;}


/* ---------- contagens (ciclos): atual, nova e histórico ---------- */
.card-atual{border-left:4px solid var(--brand-500);}
.card-nova{border-left:4px solid var(--warning);}
.ciclo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.ciclo-nome{font-size:1.05rem;font-weight:800;color:var(--brand-800);}
.aviso-box{margin-top:12px;background:var(--warning-bg,#fff8e8);border:1px solid var(--warning);border-radius:var(--radius-md);padding:12px;font-size:.86rem;color:var(--text-primary);}
.modo-box{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
.modo-opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-top:10px;cursor:pointer;transition:border-color .15s,background .15s;}
.modo-opt:hover{border-color:var(--brand-400);}
.modo-opt.sel{border-color:var(--brand-500);background:var(--brand-50);}
.modo-opt input{margin-top:3px;flex:none;width:18px;height:18px;accent-color:var(--brand-600,#1b7d0a);}
.modo-opt > div > strong{display:block;font-size:.92rem;margin-bottom:3px;}
.modo-opt div div{font-size:.82rem;color:var(--text-secondary);line-height:1.45;}
@media (max-width:560px){.ciclo-head{flex-direction:column;}.modo-opt{padding:10px;}}

footer.app-footer{max-width:1180px;margin:0 auto;padding:6px 18px 20px;color:var(--text-muted);font-size:.72rem;text-align:center;}
</style>
</head>
<body>

<script src="js/13-fechamento-email.js"></script>

<script src="js/14-boot.js"></script>
</body>
